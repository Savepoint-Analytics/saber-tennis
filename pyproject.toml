[project]
name = "tennis-sabermetrics"
version = "0.1.0"
description = "Reproducible tennis analytics, data engineering, and modeling for Savepoint Analytics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=2.18",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "mlflow>=2.17",
    "numpy>=2.1",
    "optuna>=4.0",
    "pandas>=2.2",
    "pandera>=0.20",
    "plotly>=5.24",
    "polars>=1.12",
    "psycopg[binary]>=3.2",
    "pyarrow>=17.0",
    "pydantic>=2.9",
    "rich>=13.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "statsmodels>=0.14",
    "typer>=0.12",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
tennis-sabermetrics = "tennis_sabermetrics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["tennis_sabermetrics"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

